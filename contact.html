<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <header class="site-header">
    <nav class="navbar container">
      <a href="index.html" class="brand"><span class="brand-mark">&#10003;</span> TaskFlow</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">Menu</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="tasks.html">My Tasks</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><button id="themeToggle" class="btn btn-outline btn-small">Dark</button></li>
      </ul>
    </nav>
  </header>

  <main class="container section narrow">
    <h1 class="page-title">Contact &amp; Feedback</h1>
    <p class="lead">Have a suggestion or found a bug? Send us a message.</p>
    <form id="contactForm" class="card form-card" novalidate>
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" placeholder="Enter your full name">
        <span class="error" id="nameError"></span>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com">
        <span class="error" id="emailError"></span>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>
        <span class="error" id="messageError"></span>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
      <p class="success" id="formSuccess" hidden>Thank you! Your message has been sent successfully.</p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container"><p>&copy; 2026 TaskFlow. Built with HTML, CSS and JavaScript.</p></div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
